llm:
  provider: anthropic        # anthropic | bedrock
  model: claude-sonnet-5-5
  temperature: 0
  max_tokens: 1024

embeddings:
  model: BAAI/bge-small-en-v1.5   # free, runs locally

chunking:
  chunk_size: 800            # characters
  chunk_overlap: 150

retrieval:
  mode: hybrid               # vector | bm25 | hybrid
  top_k: 8
  rerank: true
  rerank_top_n: 4

vector_store:
  type: chroma               # chroma | pgvector
  path: chroma_db

guardrails:
  block_prompt_injection: true
  redact_pii: true
  refuse_if_no_source: true
